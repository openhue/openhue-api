type: object
allOf:
  - $ref: '../../common/Resource.yaml'
  - type: object
    properties:
      metadata:
        type: object
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 32
            description: Human readable name of the configuration.
      name:
        type: string
        minLength: 1
        maxLength: 32
        deprecated: true
        description: Same as metadata.name.
      configuration_type:
        type: string
        enum:
          - screen
          - monitor
          - music
          - 3dspace
          - other
        description: Type of entertainment configuration.
      status:
        type: string
        enum:
          - active
          - inactive
        description: Status of the entertainment configuration.
      stream_proxy:
        type: object
        properties:
          mode:
            type: string
            enum:
              - auto
              - manual
          node:
            $ref: '../../common/ResourceIdentifier.yaml'
      channels:
        type: array
        items:
          type: object
          properties:
            channel_id:
              type: integer
            position:
              $ref: './EntertainmentPosition.yaml'
            members:
              type: array
              items:
                type: object
                properties:
                  service:
                    $ref: '../../common/ResourceIdentifier.yaml'
                  index:
                    type: integer
      locations:
        type: object
        properties:
          service_locations:
            type: array
            items:
              type: object
              properties:
                service:
                  $ref: '../../common/ResourceIdentifier.yaml'
                position:
                  allOf:
                    - $ref: './EntertainmentPosition.yaml'
                  deprecated: true
                  description: Same as the first entry of positions.
                equalization_factor:
                  type: number
                  default: 1
                  maximum: 1
                  description: Relative equalization factor applied to the entertainment service, to compensate for differences in brightness in the entertainment configuration. Value cannot be 0, writing 0 changes it to lowest possible value.
                positions:
                  type: array
                  items:
                    $ref: './EntertainmentPosition.yaml'
      light_services:
        type: array
        items:
          $ref: '../../common/ResourceIdentifier.yaml'
