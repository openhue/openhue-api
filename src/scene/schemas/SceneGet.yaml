type: object
allOf:
  - $ref: '../../common/ResourceOwned.yaml'
  - type: object
    required:
      - actions
      - metadata
      - group
      - speed
      - auto_dynamic
      - status
    properties:
      type:
        type: string
        enum:
          - scene
      actions:
        type: array
        description: List of actions to be executed synchronously on recall
        items:
          $ref: './ActionGet.yaml'
      metadata:
        $ref: './SceneMetadata.yaml'
      group:
        $ref: '../../common/ResourceIdentifier.yaml'
      palette:
        $ref: './ScenePalette.yaml'
      speed:
        type: number
        minimum: 0
        maximum: 1
        description: Speed of dynamic palette for this scene
      auto_dynamic:
        type: boolean
        description: Indicates whether to automatically start the scene dynamically on active recall
      status:
        type: object
        properties:
          active:
            type: string
            enum:
              - inactive
              - static
              - dynamic_palette
          last_recall:
            type: string
            format: date-time
            description: When the scene was last recalled. Absent if it never was.
      recall:
        type: object
        description: Empty on GET. Recall the scene through ScenePut.
      last_actions_update:
        type: object
        description: What last changed the scene actions.
        properties:
          source:
            type: string
            example: clip
