type: object
allOf:
  - $ref: '../../common/Resource.yaml'
  - type: object
    properties:
      description:
        type: string
        description: Description of the behavior script.
      configuration_schema:
        type: object
        description: JSON schema for configuration.
      trigger_schema:
        type: object
        description: JSON schema for trigger.
      state_schema:
        type: object
        description: JSON schema for state.
      version:
        type: string
        description: Version of the behavior script.
      metadata:
        type: object
        properties:
          name:
            type: string
          category:
            type: string
      supported_features:
        type: array
        description: Optional features this script supports.
        items:
          type: string
          example: style_sunrise
      max_number_instances:
        type: integer
        minimum: 0
        maximum: 255
        description: Maximum number of instances of this script.
